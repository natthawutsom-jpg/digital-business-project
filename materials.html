<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายการวัสดุ</title><link rel="stylesheet" href="assets/style.css"></head><body><aside><h2>📦 MaterialFlow</h2><p>ระบบเบิกจ่ายวัสดุ</p><nav><a href="index.html">🏠 หน้าหลัก</a><a href="materials.html">📦 รายการวัสดุ</a><a class="requester" href="request.html">📝 เบิกวัสดุ</a><a class="stock" href="approval.html">✅ ควบคุมการเบิก</a><a href="my-requests.html">📋 รายการเบิกของฉัน</a><a href="profile.html">👤 โปรไฟล์</a></nav><button class="logout" onclick="logout()">ออกจากระบบ</button></aside><header><div><b>ระบบจัดการวัสดุ</b><small>วิทยาลัยรัตภูมิ</small></div><div class="user">👤 <span id="userName"></span> · <span id="roleName"></span></div></header><main><div class="wrap"><div class="page-title"><div><h1>📦 สต็อกวัสดุ</h1><p>ตรวจสอบวัสดุคงเหลือทั้งหมด และสำหรับผู้คุมสต็อกสามารถเพิ่มจำนวนได้</p></div></div><div class="toolbar"><input class="searchbox" id="q" placeholder="🔎 ค้นหารหัส / ชื่อวัสดุ"><select id="cat"><option value="">ทุกหมวดหมู่</option></select></div><div class="data-panel"><div class="table-wrap"><table class="dense-table"><thead><tr><th>รหัส</th><th>วัสดุ</th><th>หมวดหมู่</th><th>หน่วย</th><th>คงเหลือ</th><th>จุดสั่งซื้อ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></main><div id="toast" class="toast"></div><script src="assets/app.js"></script><script>function render(){let ms=getMaterials(),qv=q.value.toLowerCase(),cv=cat.value;tbody.innerHTML=ms.filter(m=>(!qv||(m.id+' '+m.name+' '+m.cat).toLowerCase().includes(qv))&&(!cv||m.cat===cv)).map(m=>{let s=status(m),c=s==='มีสต็อก'?'green':s==='ใกล้หมด'?'orange':'red';let act=u.role==='stock'?`<button onclick="addStock('${m.id}')">＋ เพิ่มสต็อก</button>`:'—';return `<tr><td>${m.id}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.cat)}</td><td>${esc(m.unit)}</td><td><b>${m.stock}</b></td><td>${m.min}</td><td><span class="chip ${c}">${s}</span></td><td>${act}</td></tr>`}).join('')}function addStock(id){let n=parseInt(prompt('เพิ่มสต็อกกี่หน่วย?'));if(!n||n<1)return;let ms=getMaterials(),m=ms.find(x=>x.id===id);m.stock+=n;saveMaterials(ms);toast('เพิ่มสต็อกเรียบร้อย');render()}[...new Set(getMaterials().map(x=>x.cat))].forEach(c=>cat.innerHTML+=`<option>${esc(c)}</option>`);q.oninput=render;cat.onchange=render;render();</script></body></html>
