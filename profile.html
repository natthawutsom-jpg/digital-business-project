<!doctype html><html lang="th"><head><meta charset="UTF-8"><title>โปรไฟล์</title><link rel="stylesheet" href="assets/style.css"></head><body><aside><h2>📦 MaterialFlow</h2><p>ระบบเบิกจ่ายวัสดุ</p><nav><a href="index.html">🏠 หน้าหลัก</a><a href="materials.html">📦 รายการวัสดุ</a><a class="requester" href="request.html">📝 เบิกวัสดุ</a><a class="stock" href="approval.html">✅ อนุมัติการเบิก</a><a href="my-requests.html">📋 รายการเบิกของฉัน</a><a href="profile.html">👤 โปรไฟล์</a></nav><button class="logout" onclick="logout()">ออกจากระบบ</button></aside><header><div><b>ระบบจัดการวัสดุ</b><small>วิทยาลัยรัตภูมิ</small></div><div class="user">👤 <span id="userName"></span> · <span id="roleName"></span></div></header><main><div class="wrap"><section class="panel"><div class="profile"><div class="avatar">ณ</div><div><h2 id="profileName"></h2><p id="profileRole"></p><p>วิทยาลัยรัตภูมิ</p></div></div></section></div></main><script>const u=JSON.parse(localStorage.materialUser||"null");if(!u)location="login.html";document.addEventListener("DOMContentLoaded",()=>{userName.textContent=u.name;roleName.textContent=u.roleName;document.querySelectorAll(".requester").forEach(x=>{if(u.role!=="requester")x.style.display="none"});document.querySelectorAll(".stock").forEach(x=>{if(u.role!=="stock")x.style.display="none"});document.querySelectorAll(".requester-page").forEach(x=>{if(u.role!=="requester")x.innerHTML="<div class='panel'><h2>ไม่มีสิทธิ์เข้าถึง</h2><p>หน้านี้สำหรับผู้เบิกเท่านั้น</p></div>"});document.querySelectorAll(".stock-page").forEach(x=>{if(u.role!=="stock")x.innerHTML="<div class='panel'><h2>ไม่มีสิทธิ์เข้าถึง</h2><p>หน้านี้สำหรับผู้ควบคุมสต็อกเท่านั้น</p></div>"})});function logout(){localStorage.removeItem("materialUser");location="login.html"}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.className="toast show";setTimeout(()=>x.className="toast",2200)};profileName.textContent=u.name;profileRole.textContent=u.roleName</script></body></html>
